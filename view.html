<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EduArt Interactive</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }
    #app-container, iframe {
      width: 100vw;
      height: 100vh;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <div id="app-container"></div>

  <script>
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      const id = urlParams.get('id');
      const lang = urlParams.get('lang') || 'ar';
      const key = urlParams.get('key');
      
      const SECRET_KEY = "edu2026";
      // استبدلي هذا الرابط برابط صفحة الكمين الخاصة بكِ
      const TRAP_PAGE_URL = "https://edu-art-3d-book.my.canva.site/ocean-trap"; 

      // 1. التحقق من مفتاح الحماية
      if (key !== SECRET_KEY) {
        window.location.href = TRAP_PAGE_URL;
        return;
      }

      // 2. تنظيف شريط العنوان فوراً ومسح المفتاح السري!
      const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + `?id=${id}&lang=${lang}`;
      window.history.replaceState({path: cleanUrl}, '', cleanUrl);

      // 3. خريطة الروابط (استبدلي your-username باسم حسابك الحقيقي)
      const modelsBaseUrls = {
        "shark": "https://edu-art-3d.github.io/Eduart-shark-3D/",
"octopus": "https://edu-art-3d.github.io/Eduart-octopus-3D/",
"seaturtle": "https://edu-art-3d.github.io/Eduart-seaturtle-3D/",
"anglerfish": "https://edu-art-3d.github.io/Eduart-anglerfish-3D/",
"Crocodile": "https://edu-art-3d.github.io/Eduart-Crocodile-3D/",
"hippo": "https://edu-art-3d.github.io/Eduart-hippo-3D/",
"dolphin": "https://edu-art-3d.github.io/Eduart-dolphin-3D/",
"clownfish": "https://edu-art-3d.github.io/Eduart-clownfish-3D/",
"whale": "https://edu-art-3d.github.io/Eduart-whale-3D/",
"seahorse": "https://edu-art-3d.github.io/Eduart-seahorse-3D/",
"sealion": "https://edu-art-3d.github.io/Eduart-sealion-3D/",
"stingray": "https://edu-art-3d.github.io/Eduart-stingray-3D/",
"crab": "https://edu-art-3d.github.io/Eduart-crab-3D/",
"hammerheadshark": "https://edu-art-3d.github.io/Eduart-hammerheadshark-3D/",
"swordfish": "https://edu-art-3d.github.io/Eduart-swordfish-3D/",
"orca": "https://edu-art-3d.github.io/Eduart-orca-3D/",
"squid": "https://edu-art-3d.github.io/Eduart-squid-3D/",
"bluetang": "https://edu-art-3d.github.io/Eduart-bluetang-3D/",
"flyingfish": "https://edu-art-3d.github.io/Eduart-flyingfish-3D/",
"ichthyosaurus": "https://edu-art-3d.github.io/Eduart-ichthyosaurus-3D/"
      };

      const selectedModel = modelsBaseUrls[id];

      if (selectedModel) {
        // فتح نموذج الفيل داخل iframe وتمرير المفتاح له
        const targetUrl = selectedModel + "?key=" + SECRET_KEY;
        document.getElementById('app-container').innerHTML = `<iframe src="${targetUrl}" allow="camera; microphone; ar"></iframe>`;
      } else {
        window.location.href = TRAP_PAGE_URL;
      }
    })();
  </script>

</body>
</html>
